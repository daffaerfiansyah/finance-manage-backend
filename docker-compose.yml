services:
  db:
    image: postgres:16-alpine
    container_name: finance_db
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-finance_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: >
      postgres
      -c shared_buffers=64MB
      -c work_mem=4MB
      -c maintenance_work_mem=16MB
      -c max_connections=20
    networks:
      - finance_network

  api:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    container_name: finance_api
    restart: always
    ports:
      - "80:8080"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-finance_db}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-secret_password}
    depends_on:
      - db
    volumes:
      - ./storage:/var/www/html/storage
    networks:
      - finance_network

volumes:
  postgres_data:
    driver: local

networks:
  finance_network:
    driver: bridge
